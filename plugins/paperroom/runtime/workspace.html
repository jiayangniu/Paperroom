<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperroom · 作者写作室</title>
<style>
:root {
  color-scheme:light;
  --ink:#292b26; --muted:#5f655b; --faint:#787c70; --rule:#d8d9ca;
  --leaf:#334d36; --leaf-hover:#263c28; --sage:#e4eadb; --red:#934e39;
  --surface:#fffefa; --paper:#faf9f4; --rail:#efefe5; --note:#f6efdd;
  --serif:"Iowan Old Style",Baskerville,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button,a,summary{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
a{color:var(--leaf);text-underline-offset:3px}
:focus-visible{outline:2px solid #53754b;outline-offset:3px}
[hidden]{display:none!important}
button{border:0;background:none}
.mast{height:64px;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.mast-left,.mast-right,.row,.nav-caption,.key-actions,.sheet-tools,.anchors,.comment-top,.row-tools{display:flex;align-items:center;gap:10px}
.mast-left{gap:13px}
.wordmark{font:600 29px/1 var(--serif);letter-spacing:-1.45px}
.book{display:inline-block;position:relative;width:23px;height:27px;border:1.5px solid var(--leaf);border-radius:2px 3px 3px 2px;background:var(--sage);box-shadow:-2px 2px var(--surface),-3px 3px var(--leaf)}
.book:before{content:"";position:absolute;left:4px;top:0;bottom:0;border-left:1px solid var(--leaf)}
.book:after{content:"";position:absolute;right:3px;top:5px;width:8px;height:4px;border-block:1px solid var(--leaf)}
.mast-tag{font-size:13px;color:var(--muted);border-left:1px solid var(--rule);padding-left:15px}
.mast-right{color:var(--muted);font-size:13px}
.mast-right:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--leaf)}
.shell{display:grid;grid-template-columns:clamp(202px,19vw,262px) minmax(0,1fr);min-height:calc(100vh - 64px)}
.rail{background:var(--rail);border-right:1px solid var(--rule);padding:29px 15px 40px;overflow-wrap:anywhere}
.nav-caption{font-size:12px;letter-spacing:.08em;font-weight:650;color:var(--muted);padding:0 12px 10px}
.nav-block+.nav-block{border-top:1px solid var(--rule);margin-top:22px;padding-top:17px}
.navitem,.jump{width:100%;text-align:left;padding:7px 10px;display:flex;align-items:flex-start;gap:9px;border-radius:5px}
.navitem:hover,.jump:hover,.smallbtn:hover{background:#e6e8db}
.navitem[aria-current=page]{background:#dfe7d7;color:#253e29;font-weight:650}
.navitem.level2{padding-left:19px;font-size:14px}
.navitem.level3{padding-left:31px;color:var(--muted);font-size:13px}
.glyph{font-family:Georgia,serif;min-width:15px;display:inline-flex;align-items:center;justify-content:center;color:var(--leaf);font-size:16px}
.navitem .count{margin-left:auto;color:var(--muted);font-size:12px}
.nav-title{flex:1;min-width:0;overflow-wrap:anywhere}
.legacy{margin:20px 10px;color:var(--muted);font-size:13px}
.legacy a{display:block;margin:6px 0}
.mobile-nav{display:none}
.main{min-width:0;max-width:1600px;width:100%;margin:0 auto;padding:31px clamp(24px,3.5vw,60px) 72px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb span:not(:last-child):after{content:"/";color:#a3a593;margin-left:8px}
h1,h2,h3,p{margin-top:0}
h1{font:600 clamp(33px,3.3vw,52px)/1.2 var(--serif);letter-spacing:-.04em;margin-bottom:8px;overflow-wrap:anywhere}
.heading{margin-bottom:26px}
.intro{margin:0;color:var(--muted);max-width:68ch}
.workspace{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(205px,1fr);gap:clamp(16px,2.2vw,34px);align-items:start}
.sheet,.ref-card,.annotate,.manuscript{background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.sheet{padding:clamp(18px,2.5vw,38px)}
.sheet h2,.annotate h2,.ref-card h2,.manuscript h2{font:600 22px/1.35 var(--serif);letter-spacing:-.035em;margin-bottom:14px}
.ref-card{padding:19px;background:#f1f2e8}
.ref-card+.ref-card,.right-stack>*+*{margin-top:15px}
.ref-card h2{font-size:19px;margin-bottom:9px}
.ref-section{border-top:1px solid #d4d7c8;padding:12px 0 0;margin-top:12px}
.ref-section:first-of-type{margin-top:8px}
.ref-section h3,.tiny-title{font-size:12px;color:var(--leaf);font-family:var(--sans);font-weight:650;margin:0 0 5px}
.ref-section p,.ref-section li,.draft-recovery,.review-history p,.previous-text,.source-text{white-space:pre-wrap;overflow-wrap:anywhere}
.ref-section p,.ref-section li{font-size:14px;margin:0 0 8px;line-height:1.65}
.ref-section ol,.ref-section ul{padding-left:20px;margin:0}
.ref-section .here{font-weight:650}
.ref-section summary,details>summary{cursor:pointer;font-size:14px;color:var(--leaf)}
.asset-edit{margin-top:8px}
small,.muted,.form-hint{font-size:13px;color:var(--muted)}
.form-hint{margin:0 0 12px}
label,.form-label{display:block;font-size:14px;font-weight:650}
input[type=text],textarea,select{width:100%;max-width:100%;border:1px solid #b8bdad;background:#fffefa;padding:9px 11px;border-radius:4px;line-height:1.55}
input[type=text],textarea{margin-top:5px}
textarea{display:block;min-height:81px;resize:vertical;line-height:1.7}
textarea.large{min-height:145px}
textarea::placeholder,input::placeholder{color:#777b70;opacity:1;font-weight:400}
.field+.field{margin-top:14px}
.plan-row{border-top:1px solid var(--rule);padding:17px 0 18px}
.plan-row:first-of-type{padding-top:12px}
.plan-row .field+.field{margin-top:9px}
.row-top,.form-footer,.card-top,.page-bar,.review-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row-top{margin-bottom:9px}
.row-top h3,.page-bar h3{font:600 17px/1.45 var(--serif);margin:0}
.row-tools{gap:2px}
.smallbtn,.quiet{font-size:13px;color:var(--leaf);padding:4px 8px;border-radius:4px}
.smallbtn{min-height:32px;min-width:30px}
.quiet{text-decoration:underline;text-underline-offset:3px}
.primary,.secondary,.add,.linkbtn{font-weight:600;line-height:1.4;border-radius:5px;min-height:40px;padding:9px 14px;text-align:center}
.primary{background:var(--leaf);color:white;border:1px solid var(--leaf)}
.primary:hover{background:var(--leaf-hover)}
.secondary,.linkbtn{background:var(--surface);color:var(--leaf);border:1px solid #bfc7b6}
.secondary:hover,.linkbtn:hover{background:#eff2e9}
.add{width:100%;border:1px dashed #adb6a4;color:var(--leaf);background:#f7f8f1}
.add:hover{background:#eef0e5}
.form-footer{margin-top:20px;border-top:1px solid var(--rule);padding-top:17px}
.notice{background:#e7edde;color:#29422e;border:1px solid #cbd9c4;border-radius:5px;padding:11px 15px;margin-bottom:17px;line-height:1.6}
.notice.error{background:#f6eae2;border-color:#e3cbbc;color:#713c2b}
.notice:empty{display:none}
.warning{background:var(--note);color:#695020;border-left:3px solid #aa8643;padding:10px 13px;margin:0 0 15px;font-size:14px}
.draft-recovery{font:14px/1.65 var(--sans);padding:12px;background:white;margin:7px 0}
.status{display:inline-flex;align-items:center;gap:5px;color:#496244;font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border:1px solid #708267;border-radius:50%;flex:none}
.dot.on{background:#6d8264}
.jump{justify-content:space-between;border-top:1px solid var(--rule);border-radius:0;padding:10px 4px;gap:8px;color:var(--leaf);font-size:14px}
.jump span:first-child{overflow-wrap:anywhere}
.jump span:last-child{flex-shrink:0}
.empty{padding:20px 0;color:var(--muted);margin:0}
.review-layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(260px,1fr);gap:20px;align-items:start}
.manuscript{padding:14px;background:#eaeae1}
.page-bar{padding:0 2px 10px;gap:8px}
.page-bar select{width:auto;max-width:100%;font-size:13px;padding:6px}
.page-frame{background:white;position:relative;border:1px solid #d0d1c5;margin:0;isolation:isolate}
.page-frame img{display:block;width:100%;height:auto}
.page-frame[data-can-mark=true] img{cursor:crosshair}
.page-frame+.page-frame{margin-top:16px}
.page-label{font-size:12px;color:var(--muted);margin:3px 0 6px}
.mark{position:absolute;z-index:1;transform:translate(-50%,-100%);display:grid;place-items:center;border:none;border-radius:50% 50% 50% 0;background:var(--leaf);border:2px solid white;color:white;box-shadow:0 2px 4px #20241844;min-width:24px;height:24px;font:600 12px var(--sans)}
.mark.current{background:#945e3e}
.annotate{padding:18px}
.annotate .form-label,.annotate label{font-size:13px}
.annotate select{font-size:14px}
.review-title h2{margin-bottom:0}
.review-title{margin-bottom:14px}
.comment{border-top:1px solid var(--rule);padding:12px 0 4px}
.comment p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-top{justify-content:space-between;align-items:baseline}
.comment-top strong{font-size:13px;color:var(--leaf)}
.comment blockquote,.current-anchor{margin:7px 0;padding:7px 9px;background:#f2f2e9;border-left:2px solid #a1ad94;font-size:13px;overflow-wrap:anywhere}
.current-anchor{display:flex;align-items:center;justify-content:space-between}
.kind-row{border:0;padding:0;margin:10px 0;display:flex;gap:14px;flex-wrap:wrap}
.kind-row legend{font-size:13px;font-weight:600;margin-bottom:4px}
.kind-row label{font-weight:400}
.kind-row input{accent-color:var(--leaf);margin:0 4px 0 0}
.key-actions{margin-top:13px;flex-wrap:wrap}
details.sheet-tools{display:block;margin-top:12px;padding:12px 15px;background:var(--surface);border:1px solid var(--rule);border-radius:5px}
.source-text,.previous-text{font:14px/1.65 var(--serif);padding:10px 0;border-top:1px solid var(--rule);margin:8px 0 0}
.review-side{min-width:0}
.review-side>.ref-card{margin-top:12px}
.note-target{font-weight:600;font-size:12px;color:var(--leaf)}
.warning button{margin-block:4px}
.skip{position:absolute;left:-9000px}.skip:focus{position:fixed;left:10px;top:8px;z-index:5;background:white;padding:5px}
@media(min-width:1300px){.review-mode .main{padding-inline:38px}.review-mode .shell{grid-template-columns:212px minmax(0,1fr)}}
@media(max-width:1070px){.main{padding-inline:22px}.shell{grid-template-columns:195px minmax(0,1fr)}.workspace{grid-template-columns:minmax(0,1.7fr) minmax(185px,1fr);gap:13px}.review-layout{grid-template-columns:minmax(0,1.6fr) minmax(225px,1fr);gap:12px}.rail{padding-inline:9px}}
@media(max-width:850px){.shell{display:block}.rail{display:none;border-right:0;border-bottom:1px solid var(--rule);padding:16px 19px}.rail.open{display:block}.mobile-nav{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);color:var(--leaf);border-radius:4px;padding:5px 8px;font-size:13px}.mast{padding:0 20px}.mast-right{display:none}.main{padding:23px 20px 56px}.workspace{grid-template-columns:minmax(0,2fr) minmax(196px,1fr)}}
@media(max-width:640px){.workspace,.review-layout{display:flex;flex-direction:column;gap:15px}.workspace>* , .review-layout>*{width:100%}.workspace .right-stack{order:-1}.right-stack .ref-card{padding:12px 15px}.ref-card .ref-section{padding-top:7px;margin-top:7px}.sheet{padding:16px}.heading{margin-bottom:18px}.review-side{display:flex;flex-direction:column}.review-side .annotate{order:0}.manuscript{padding:9px}.main{padding-inline:14px}.mast{height:56px;padding-inline:15px}.mast-tag{display:none}.form-footer .primary{width:100%}.heading h1{font-size:33px}.row-top{gap:4px}.crumb{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.reference-toggle{display:none}
.reference-sheet>.reference-body{margin-top:0}
.reference-body>.ref-card+.ref-card{margin-top:15px}
.comment.pair-active{background:#e9efdf;box-shadow:inset 3px 0 #617953;padding-left:9px}
.mark.pair-active{background:#dbe8c8;color:#253825;border-color:#405738;outline:2px solid white;z-index:2}
.comment{scroll-margin-block:20px}
.mark{scroll-margin-block:64px}
.to-pin{padding:4px 0;color:var(--leaf);text-underline-offset:3px;text-decoration:underline;font-size:13px}
@media(max-width:640px){
  .main:has(.reference-sheet){padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .main:has(.reference-sheet.open){padding-bottom:calc(40vh + 24px + env(safe-area-inset-bottom,0px));padding-bottom:calc(40dvh + 24px + env(safe-area-inset-bottom,0px))}
  .workspace>.reference-sheet{position:fixed;z-index:4;inset:auto 0 0;width:auto;display:flex;flex-direction:column;overflow:hidden;max-height:40vh;max-height:40dvh;background:var(--surface);border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 18px #3036260f}
  .reference-toggle{display:flex;width:100%;min-height:44px;flex:0 0 auto;align-items:center;justify-content:space-between;padding:8px 20px;color:var(--leaf);font-size:14px;font-weight:650}
  .reference-toggle:after{content:"⌃";font-size:18px;line-height:1;transform:translateY(3px)}
  .reference-toggle[aria-expanded=true]:after{transform:rotate(180deg) translateY(2px)}
  .reference-toggle:focus-visible{outline-offset:-4px;border-radius:12px}
  .reference-body{display:none;overflow:auto;overscroll-behavior:contain;padding:0 12px 12px;min-height:0}
  .reference-sheet.open .reference-body{display:block}
  .reference-sheet .ref-card{box-shadow:none}
  .to-pin{min-height:40px}
  .mark:before{content:"";position:absolute;inset:-6px;border-radius:50%}
}

<div class="shell"><nav class="rail" id="nav" aria-label="论文目录"></nav><main class="main" id="main" tabindex="-1"><div id="notice" role="status" aria-live="polite" class="notice"></div><div id="content"><p>正在读取写作项目…</p></div></main></div>
<script id="author-clipboard">
(() => {
  const transferEdits = new Set([
    "insertFromPaste", "insertFromPasteAsQuotation", "insertFromDrop", "insertFromYank",
    "deleteByCut", "deleteByDrag"
  ]);
  const authorFields = "#author-form [data-field], #note-editor [data-note], #app .answer";
  function guardClipboard(event) {
    if (!document.querySelector("#plan-rows, #note-editor, #app .answer")) return;
    if (event.target.closest?.("dialog")) return;
    if (event.type === "beforeinput" && !transferEdits.has(event.inputType)) return;
    const copiesSelection = event.type === "copy" || event.type === "cut";
    if (!copiesSelection && !event.target.closest?.(authorFields)) return;
    event.preventDefault();
    const notice = document.getElementById("notice");
    notice.textContent = "小黑屋内请直接输入自己的思路。复制、剪切、粘贴和拖入文字已关闭。";
  }
  for (const type of ["copy", "cut", "paste", "drop", "beforeinput"]) {
    document.addEventListener(type, guardClipboard, true);
  }
})();
</script>
<dialog id="document-reader" aria-labelledby="reader-title">
  <header class="reader-header">
    <div><p id="reader-section"></p><h2 id="reader-title">章节参考稿</h2></div>
    <button type="button" class="secondary" id="close-reader" autofocus>返回写作</button>
  </header>
  <div class="reader-tools">
    <fieldset class="reader-modes"><legend class="visually-hidden">阅读方式</legend>
      <label><input type="radio" name="reader-mode" value="single" checked>阅读</label>
      <label><input type="radio" name="reader-mode" value="compare">两版对照</label>
    </fieldset>
    <button type="button" class="secondary" id="toggle-import" aria-controls="reader-import" aria-expanded="false">导入已有稿</button>
  </div>
  <form id="reader-import" hidden>
    <fieldset id="reader-fields"><legend>导入本节参考稿</legend>
      <div class="reader-import-grid">
        <label>来源<select id="reader-source"><option value="file">上传编译好的 PDF</option><option value="project">论文目录内的 PDF 或 LaTeX</option></select></label>
        <label id="reader-upload-label">PDF 文件<input id="reader-upload" type="file" required accept="application/pdf,.pdf"></label>
        <label id="reader-path-label" hidden>项目内的文件路径<input id="reader-path" type="text" placeholder="例如 main.pdf 或 sections/intro.tex" disabled></label>
        <label>版本名称（选填）<input id="reader-label" type="text" placeholder="例如 投稿前初稿"></label>
        <label>本节所在 PDF 页码<input id="reader-pages" type="text" placeholder="例如 2-4，留空导入全部"></label>
      </div>
      <p class="form-hint" id="reader-path-hint" hidden>LaTeX 文件须能独立编译。使用整篇论文时，可选择编译好的 PDF 并填写本节页码。</p>
      <button type="submit" class="primary" id="reader-save">保存为参考稿</button>
    </fieldset>
  </form>
  <p id="reader-message" role="status" aria-live="polite"></p>
  <div id="reader-panes"></div>
</dialog>

<script>
"use strict";
const el = id => document.getElementById(id);
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr = x => Array.isArray(x) ? x : [];
const encode = encodeURIComponent;
const map = new Map();
let data, route, model, noticeTimer, loadId=0, busy=false, annotationIndex=-1, selectedRevision=0, oldDraft=null;
let activeQuote=null;
const emptyNote = () => ({paragraph:"",quote:"",location:"",kind:"change",text:""});
function readRoute(){
  const params=new URLSearchParams(location.search);
  return {view:params.get("view")||"",section:params.get("section")||"",paragraph:params.get("paragraph")||""};
}
function saveRoute(replace=false){
  const q=new URLSearchParams();
  Object.entries(route).forEach(([k,v])=>{if(v)q.set(k,v)});
  history[replace?"replaceState":"pushState"](null,"",location.pathname+"?"+q);
}
function notice(message="",error=false){
  clearTimeout(noticeTimer);
  el("notice").className="notice"+(error?" error":"");
  el("notice").textContent=message;
}
function sec(){return arr(data?.outline?.sections).find(s=>s.id===route.section)}
function archived(){return arr(data?.archived).find(s=>s.id===route.section)}
function para(){return arr(sec()?.paragraphs).find(p=>p.id===route.paragraph)}
function version(){return route.view==="review" ? currentRev()?.revision : data.outline.version}
function storageKey(){return ["paperroom-author-v2",location.pathname,data?.project||"",route.view,route.section,route.paragraph,route.view==="review"?selectedRevision:""].join(":")}
function readSaved(k){
  if(map.has(k))return map.get(k);
  try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}
}
function preserve(){
  if(!model?.dirty)return;
  const k=storageKey(), v={base:model.base,fields:model.fields,annotationIndex};
  map.set(k,v);
  try{localStorage.setItem(k,JSON.stringify(v))}catch{}
}
function clearSaved(k){
  map.delete(k);
  try{localStorage.removeItem(k)}catch{}
}
function currentRev(){
  const revisions=arr(data?.review?.revisions);
  return revisions.find(r=>r.revision===selectedRevision)||revisions.at(-1);
}
function stub(fields){return {dirty:false,base:version(),fields}}
function initModel(){
  annotationIndex=-1;oldDraft=null;activeQuote=null;
  let f;
  const o=data.outline,s=sec(),p=para();
  switch(route.view){
    case "assets": f={question:o.question||"",evidence:o.evidence||"",affected:[]};break;
    case "paper": f={items:arr(o.sections).map(s=>({id:s.id,title:s.title,purpose:s.purpose}))};break;
    case "section": f={items:arr(s?.paragraphs).map(p=>({id:p.id,purpose:p.purpose}))};break;
    case "paragraph": f={items:arr(p?.sentences).slice()};break;
    case "review": {
      const rev=currentRev();
      selectedRevision=rev?.revision||0;
      f={notes:arr(rev?.notes).map(n=>({...n})),entry:emptyNote()};
      break;
    }
  }
  if(f?.items&&!f.items.length)f.items.push(blankItem());
  model=stub(f||{});
  const saved=readSaved(storageKey());
  if(saved&&saved.fields){
    if(route.view==="review"&&currentRev()?.reviewed){oldDraft=saved.fields;return}
    if(saved.base===model.base){
      model={dirty:true,base:saved.base,fields:saved.fields};
      if(route.view==="review"&&Number.isInteger(saved.annotationIndex))annotationIndex=saved.annotationIndex;
    }
    else oldDraft=saved.fields;
  }
}
function blankItem(){
  if(route.view==="paper")return {title:"",purpose:""};
  if(route.view==="section")return {purpose:""};
  return "";
}

    return row;
  });
  if(!items.length||items.some(item=>typeof item==="string"?!item:!item.purpose||("title" in item&&!item.title)))throw Error("请填写每一项的内容，或移除多余的空行。");
  return {action:"outline",version:model.base,level:route.view,section:route.section,paragraph:route.paragraph,items};
}
function dataUrl(){return "/api/workspace"+(route.section?"?section="+encode(route.section):"")}
async function fetchData(url){
  const response=await fetch(url,{cache:"no-store"});
  const payload=await response.json();
  if(!response.ok||!payload.outline)throw Error(payload.error||"无法读取此论文的工作区。");
  return payload;
}
async function loadView(next=null,replace=false){
  if(busy)return;
  if(model)preserve();
  const id=++loadId;
  if(next){
    model=null;el("content").inert=true;
    route=next;if(route.view!=="review"||next.section!==data?.section)selectedRevision=0;
    saveRoute(replace);el("nav").classList.remove("open");el("menu").setAttribute("aria-expanded","false");
    notice();
  }
  try{
    const incoming=await fetchData(dataUrl());
    if(id!==loadId)return;
    data=incoming;fixRoute();
    if(route.view==="review"&&!selectedRevision)selectedRevision=arr(data.review?.revisions).at(-1)?.revision||0;
    saveRoute(true);initModel();render();notice();
    el("content").inert=false;el("connection").textContent="本地工作区";
    if(next){window.scrollTo(0,0);el("main").focus({preventScroll:true})}
  }catch(err){if(id===loadId){el("connection").textContent="未连接";notice(err.message+" 请刷新重试，已输入的草稿保存在本页。",true)}}
}
function safeError(error){notice(error.message||"提交失败，输入内容仍在本页。",true);el("notice").scrollIntoView({block:"nearest"})}
async function submit(payload){
  if(busy)return false;
  const k=storageKey();busy=true;el("content").inert=true;
  document.querySelectorAll(".primary").forEach(e=>e.disabled=true);
  try{
    const response=await fetch("/api/workspace",{method:"POST",headers:{"Content-Type":"application/json","X-Paperroom-Token":window.roomToken},body:JSON.stringify(payload)});
    const incoming=await response.json();
    if(!response.ok)throw Error(incoming.error||"提交失败。");
    clearSaved(k);model.dirty=false;
    data=incoming.outline?incoming:await fetchData(dataUrl());
    let message;
    if(payload.action==="assets"){
      message="写作材料已保存。";
      if(data.outline.question&&data.outline.evidence&&!data.outline.sections.length){route={view:"paper",section:"",paragraph:""};saveRoute(true)}
    }else if(payload.action==="review")message="本版审阅已提交。回到原对话，AI 即可读取你的批注。";
    else message=route.view==="paragraph"?"本段句意已保存。回到原对话，让 AI 起草这一段。":route.view==="section"?"段落大纲已保存。可以从目录选择一段写句意。":"整篇大纲已保存。可以从目录选择先写的章节。";
    initModel();render();notice(message);window.scrollTo(0,0);return true;
  }catch(err){safeError(err);if(!el("reload-latest")){
    const b=document.createElement("button");b.id="reload-latest";b.type="button";b.className="quiet";b.textContent="加载最新内容";b.onclick=()=>loadView();el("notice").append(" ",b);
  }return false}finally{busy=false;el("content").inert=false;document.querySelectorAll(".primary").forEach(e=>e.disabled=false)}
}
function redrawNotes(){
  el("annotations").outerHTML=notePanel(currentRev(),true);
  document.querySelectorAll(".page-frame").forEach(frame=>{
    frame.querySelectorAll(".mark").forEach(mark=>mark.remove());
    const page=Number(frame.querySelector("img").dataset.page);
    frame.insertAdjacentHTML("beforeend",pins(page,frame.dataset.canMark==="true"));
  });
}
function redrawRows(focusIndex){
  el("plan-rows").innerHTML=rowsHtml();touch();
  if(focusIndex!=null)el("plan-rows").querySelector('[data-idx="'+focusIndex+'"]')?.focus();
}
function updateNoteFields(e){
  let val=e.value;
  if(e.dataset.note==="kind"&&!e.checked)return;
  model.fields.entry[e.dataset.note]=val;
}
function addNote(){
  const f=model.fields,n={...f.entry};
  for(const k of ["text","location","quote","paragraph"]){n[k]=String(n[k]||"").trim();if(!n[k])delete n[k]}
  if(!n.paragraph&&!n.pin)throw Error("请在稿件上点击一个位置，或选择这条意见对应的段落。");
  if(!n.text)throw Error("请写下保留或修改的理由。");
  if(n.quote&&!n.paragraph)throw Error("要引用原句，请先选择对应段落。");
  if(annotationIndex>=0)f.notes[annotationIndex]=n;else f.notes.push(n);
  f.entry=emptyNote();annotationIndex=-1;touch();redrawNotes();
}
function entryHasContent(n){return Boolean(n?.text?.trim()||n?.pin||n?.paragraph||n?.quote?.trim()||n?.location?.trim())}
function act(op,i,trigger){
  if(busy||!model)return;
  const f=model.fields;
  if(op==="toggle-reference"){toggleReference(el("reference-toggle")?.getAttribute("aria-expanded")!=="true");return}
  if(op==="add"){f.items.push(blankItem());redrawRows(f.items.length-1);return}
  if(op==="remove"){
    const item=f.items[i];
    if(typeof item==="object"&&item.id){
      const s=route.view==="paper"?arr(data.outline.sections).find(x=>x.id===item.id):null;
      const detail=s?.paragraphs?.length?"及其已有段落":"";
      if(!confirm("移除这"+(route.view==="paper"?"个章节":"一段")+detail+"？保存大纲后生效。"))return;
    }
    f.items.splice(i,1);redrawRows();return;
  }
  if(op==="up"||op==="down"){
    const j=i+(op==="up"?-1:1);
    if(j>=0&&j<f.items.length){[f.items[i],f.items[j]]=[f.items[j],f.items[i]];redrawRows(j)}
    return;
  }
  if(op==="quote-selection"){
    if(!activeQuote)throw Error("请先在下方同一个段落中选中要引用的原句。");
    f.entry.paragraph=activeQuote.paragraph;f.entry.quote=activeQuote.quote;
    touch();redrawNotes();el("note-body")?.focus();return;
  }
  if(op==="unpin"){delete f.entry.page;delete f.entry.pin;delete f.entry.location;touch();redrawNotes();return}
  if(op==="goto-note"){
    const target=i<0?el("note-body"):el("note-"+i);
    target?.focus({preventScroll:true});target?.scrollIntoView({block:"center"});return;
  }
  if(op==="goto-pin"){
    const revision=Number(trigger?.dataset.rev)||currentRev()?.revision;
    if(revision!==currentRev()?.revision){
      preserve();selectedRevision=revision;initModel();render();
    }
    const pin=el("pin-"+i);
    pin?.focus({preventScroll:true});pin?.scrollIntoView({block:"center"});return;
  }
  if(op==="add-note"){addNote();return}
  if(op==="remove-note"){
    f.notes.splice(i,1);
    if(annotationIndex===i){f.entry=emptyNote();annotationIndex=-1}else if(annotationIndex>i)annotationIndex--;
    touch();redrawNotes();return;
  }
  if(op==="edit-note"){
    if(entryHasContent(f.entry)&&!confirm("当前正在编辑的意见会被替换。继续吗？"))return;
    annotationIndex=i;f.entry={...f.notes[i]};touch();redrawNotes();el("note-body")?.focus();return;
  }
  if(op==="cancel-note"){annotationIndex=-1;f.entry=emptyNote();touch();redrawNotes();return}
  if(op==="submit-review"){
    if(entryHasContent(f.entry))addNote();
    const rev=currentRev();
    if(f.notes.length<rev.minimum)throw Error("这一版至少需要 "+rev.minimum+" 条针对具体位置的意见。");
    return submit({action:"review",section:route.section,revision:rev.revision,notes:f.notes});
  }
}
function input(e){
  if(!model)return;
  const t=e.target;
  if(t.dataset.field){
    const name=t.dataset.field,idx=t.dataset.idx;
    if(idx===undefined)model.fields[name]=t.value;
    else if(name==="intent")model.fields.items[Number(idx)]=t.value;
    else model.fields.items[Number(idx)][name]=t.value;
    touch();
  }else if(t.dataset.note){updateNoteFields(t);touch()}
  else if(t.dataset.affected){model.fields.affected=[...document.querySelectorAll("[data-affected]:checked")].map(x=>x.dataset.affected);touch()}
}
document.addEventListener("selectionchange",()=>{
  if(route?.view!=="review")return;
  const sel=window.getSelection(),quote=sel?.toString().trim();
  if(!quote||!sel.rangeCount)return;
  const r=sel.getRangeAt(0),element=n=>n?.nodeType===1?n:n?.parentElement;
  const start=element(r.startContainer)?.closest("[data-par-text]"), end=element(r.endContainer)?.closest("[data-par-text]");
  if(start&&end===start)activeQuote={paragraph:start.dataset.parText,quote};
  else activeQuote=null;
});
let hoverPair="",focusPair="";
function paintPair(preferFocus=false){
  const active=preferFocus?(focusPair||hoverPair):(hoverPair||focusPair);
  document.querySelectorAll("[data-pair]").forEach(node=>node.classList.toggle("pair-active",Boolean(active)&&node.dataset.pair===active));
}
function pairOf(node){return node?.closest?.("[data-pair]")?.dataset.pair||""}
document.addEventListener("pointerover",e=>{const key=pairOf(e.target);if(hoverPair!==key){hoverPair=key;paintPair()}});
document.addEventListener("pointerout",e=>{const key=pairOf(e.relatedTarget);if(hoverPair!==key){hoverPair=key;paintPair()}});
document.addEventListener("focusin",e=>{
  if(e.target.matches("input,textarea,select")&&!e.target.closest("#reference-sheet"))toggleReference(false);
  focusPair=pairOf(e.target);paintPair(true);
});
document.addEventListener("focusout",e=>{focusPair=pairOf(e.relatedTarget);paintPair()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&el("reference-toggle")?.getAttribute("aria-expanded")==="true"){
    toggleReference(false);el("reference-toggle").focus();e.preventDefault();
  }
});
document.addEventListener("input",input);
document.addEventListener("change",e=>{
  if(e.target.id==="version-choice"){
    preserve();selectedRevision=Number(e.target.value);initModel();render();notice();
  }
});
document.addEventListener("click",e=>{
  if(busy)return;
  const t=e.target.closest("button[data-view],button[data-op],img[data-page]");
  if(!t)return;
  if(t.dataset.view){loadView({view:t.dataset.view,section:t.dataset.section||"",paragraph:t.dataset.paragraph||""});return}
  if(t.dataset.page&&t.parentElement.dataset.canMark==="true"){
    const bounds=t.getBoundingClientRect();
    model.fields.entry.page=Number(t.dataset.page);
    model.fields.entry.pin={x:Math.min(1,Math.max(0,(e.clientX-bounds.left)/bounds.width)),y:Math.min(1,Math.max(0,(e.clientY-bounds.top)/bounds.height))};
    touch();redrawNotes();el("note-body")?.focus({preventScroll:true});
    if(matchMedia("(max-width:640px)").matches)el("note-editor")?.scrollIntoView({block:"start"});
    return;
  }
  try{act(t.dataset.op,Number(t.dataset.i),t)}catch(err){safeError(err)}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="author-form")return;
  e.preventDefault();
  try{submit(cleanForm())}catch(err){safeError(err)}
});
el("menu").addEventListener("click",()=>{
  const open=el("nav").classList.toggle("open");el("menu").setAttribute("aria-expanded",String(open));
});
window.addEventListener("popstate",()=>{if(model)preserve();model=null;route=readRoute();selectedRevision=0;loadView()});
let refreshing=false;
async function sync(){
  if(!data||!model||busy||refreshing||document.hidden)return;
  const req=loadId;refreshing=true;
  try{
    const incoming=await fetchData(dataUrl());
    if(req!==loadId||busy)return;
    el("connection").textContent="本地工作区";
    if(JSON.stringify(incoming)===JSON.stringify(data))return;
    if(model.dirty||document.activeElement?.matches("input,textarea,select")){
      el("connection").textContent="工作区已有更新";
      if(!el("reload-latest")){
        const n=el("notice");notice("工作区已有新版本，你正在编辑的文字已暂存。");
        const b=document.createElement("button");b.type="button";b.id="reload-latest";b.className="quiet";b.textContent="查看最新内容";b.onclick=()=>loadView();n.append(" ",b);
      }
      return;
    }
    if(route.view==="review"&&selectedRevision===arr(data.review?.revisions).at(-1)?.revision)selectedRevision=0;
    data=incoming;fixRoute();initModel();render();
  }catch{el("connection").textContent="暂时离线"}finally{refreshing=false}
}
route=readRoute();loadView();window.addEventListener("focus",sync);setInterval(sync,7000);
</script></body></html>
